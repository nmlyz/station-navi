<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d82c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Station Navi</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=1.5.0">
</head>
<body>
<header class="topbar">
  <div class="brand">🚆 Station Navi <span class="ver">v1.5.0</span></div>
  <div id="netBadge" class="badge">確認中</div>
</header>
<div id="offlineBar" class="offline-bar hidden"></div>
<main id="view"></main>
<div id="commuteAlert" class="hidden" style="position:fixed;top:10px;left:10px;right:10px;z-index:200;background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.45)"></div>
<nav class="tabbar">
  <button data-tab="home" class="active">🏠<span>ホーム</span></button>
  <button data-tab="search">🔍<span>検索</span></button>
  <button data-tab="favs">⭐<span>お気に入り</span></button>
  <button data-tab="downloads">⬇️<span>ダウンロード</span></button>
  <button data-tab="settings">⚙️<span>設定</span></button>
</nav>
<div id="setupModal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>
<script src="js/database.js?v=1.5.0"></script>
<script src="js/routing.js?v=1.5.0"></script>
<script src="js/search.js?v=1.5.0"></script>
<script src="js/gps.js?v=1.5.0"></script>
<script src="js/settings.js?v=1.5.0"></script>
<script src="js/commute.js?v=1.5.0"></script>
<script src="js/updater.js?v=1.5.0"></script>
<script src="js/offline.js?v=1.5.0"></script>
<script src="js/app.js?v=1.5.0"></script>
</body>
</html>
