<!DOCTYPE html>
<html lang="ja">
<head>

<title>Station Navi</title>
<link rel="manifest" href="manifest.json">

<body>

    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2.5 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 18.3l-6.2 3.2L7 14.7 2 9.8l6.9-1z"/></symbol>

<header class="topbar">
  <div class="brand"><span class="logo"><svg class="ic"><use href="#i-train"/></svg></span> Station Navi <span class="ver">v1.8.5</span></div>
  <div id="netBadge" class="badge">確認中</div>
</header>
<div id="offlineBar" class="offline-bar hidden"></div>
<main id="view"></main>
<div id="commuteAlert" class="hidden" style="position:fixed;top:10px;left:10px;right:10px;z-index:200;background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.45)"></div>
<nav class="tabbar">

  <button data-tab="search"><svg class="ic"><use href="#i-search"/></svg><span>検索</span></button>
  <button data-tab="favs"><svg class="ic"><use href="#i-star"/></svg><span>お気に入り</span></button>
  <button data-tab="downloads"><svg class="ic"><use href="#i-download"/></svg><span>ダウンロード</span></button>
  <button data-tab="settings"><svg class="ic"><use href="#i-settings"/></svg><span>設定</span></button>
</nav>
<div id="setupModal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>

</html>
